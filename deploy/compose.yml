# Projeto Compose isolado "medsmell-blog" na VPS. Não toca em outras stacks.
name: medsmell-blog
services:
  blog:
    build: ..
    image: medsmell-blog:latest
    restart: unless-stopped
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=portainer_default
      - traefik.http.routers.medsmell-blog.rule=Host(`blog.medsmell.com.br`)
      - traefik.http.routers.medsmell-blog.entrypoints=websecure
      - traefik.http.routers.medsmell-blog.tls.certresolver=leresolver
      - traefik.http.services.medsmell-blog.loadbalancer.server.port=80
    mem_limit: 64m
networks:
  traefik:
    external: true
    name: portainer_default
